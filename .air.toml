root = "."
tmp_dir = "tmp"
env_files = []

[build]
cmd = "go build -o ./tmp/jiezhang-server ."
entrypoint = ["./tmp/jiezhang-server"]
include_ext = ["go", "json"]
include_file = ["go.mod", "go.sum"]
exclude_dir = [".git", "bin", "tmp", "vendor", "node_modules", "public", "docker", "migrations"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 500
poll = true
poll_interval = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "10s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
